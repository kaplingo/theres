/* Fresh start screen: deliberately only a START button, centered and readable. */
#startScreen{background:linear-gradient(145deg,#ffedf6 0%,#fce1ee 65%,#eaf7e6 100%);padding:12px}
.start-center{height:100%;width:100%;display:flex;align-items:center;justify-content:center}
.start-only{border:0;border-radius:26px;background:linear-gradient(180deg,#fb879c,#e94e74);color:white;font-size:clamp(32px,5vw,56px);letter-spacing:3px;font-weight:1000;padding:clamp(20px,3vh,30px) clamp(70px,12vw,130px);box-shadow:0 11px 0 #c53b61,0 19px 28px #d67a9777;transition:transform .14s,box-shadow .14s}
.start-only:hover{transform:translateY(-3px)}.start-only:active{transform:translateY(6px);box-shadow:0 5px 0 #c53b61}
/* Fluid game content scales to the viewport and uses the available area. */
.gamebox{width:100%;max-width:100%;}
.question-area{width:100%;}
.picture{max-height:100%;}
.picture .object svg{display:block}
.gamebox:has(.number-card) .instruction:empty,.gamebox:has(.number-card) .step-caption:empty{display:none}
.gamebox:has(.number-card) .number-card{gap:clamp(8px,2vh,19px)}
.gamebox:has(.number-card) .number-icon{font-size:clamp(43px,8vh,72px)}
.gamebox:has(.number-card) .speaker{width:clamp(50px,9vh,67px);height:clamp(50px,9vh,67px)}
.match-card .picture{min-height:0}

/* Animated level transition, isolated to the completion interlude. */
#gameScreen[data-level="finish"] .next-level-message{
  font-family:ui-rounded,'Trebuchet MS','Arial Rounded MT Bold',system-ui,sans-serif;
  font-weight:1000;letter-spacing:.035em;line-height:1.1;text-align:center;
  font-size:clamp(34px,min(7vw,8vh),76px);
  padding:clamp(8px,2vh,18px) clamp(16px,3vw,30px);
  color:#ec4b86;
  text-shadow:0 3px 0 #fff,0 7px 0 #f9bfda,0 11px 16px rgba(214,85,143,.18);
  background:linear-gradient(105deg,#fff8fb 0%,#ffe1f0 55%,#efffdf 100%);
  border:4px solid white;border-radius:28px;
  box-shadow:0 8px 0 #f4b4d3,0 14px 30px rgba(180,83,137,.17);
  animation:nextLevelPop .8s cubic-bezier(.2,1.45,.35,1) both,nextLevelFloat 1.45s .8s ease-in-out infinite;
}
#gameScreen[data-level="finish"] .interlude{gap:clamp(10px,2vh,18px)}
#gameScreen[data-level="finish"] .interlude-emoji{animation:nextLevelWiggle 1.4s ease-in-out infinite}
@keyframes nextLevelPop{0%{opacity:0;transform:scale(.35) rotate(-12deg)}65%{opacity:1;transform:scale(1.12) rotate(3deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes nextLevelFloat{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-9px) rotate(1deg)}}
@keyframes nextLevelWiggle{0%,100%{transform:rotate(-7deg) scale(1)}50%{transform:rotate(8deg) scale(1.08)}}
@media(max-width:620px){#gameScreen[data-level="finish"] .next-level-message{font-size:clamp(29px,9vw,52px);padding:12px 16px;border-radius:22px}}
@media(max-height:550px){#gameScreen[data-level="finish"] .next-level-message{font-size:clamp(26px,7vh,42px);padding:7px 15px}}
@media(prefers-reduced-motion:reduce){#gameScreen[data-level="finish"] .next-level-message,#gameScreen[data-level="finish"] .interlude-emoji{animation:none}}

/* Level 3: keep all option card backgrounds identical; answer depends only on count. */
#gameScreen[data-level="3"] .image-option,
#gameScreen[data-level="3"] .image-option:nth-child(2){background:#fff6fa;border-color:#f9dae4}
#gameScreen[data-level="3"] .image-option.correct{background:#e0f7d9;border-color:#55bd75}
#gameScreen[data-level="3"] .image-option.wrong{background:#ffe8ed;border-color:#ef7688}

/* Bitiş ekranı: oyun içeriğiyle aynı ekrana sığan animasyonlu tamamlanma etiketi. */
#gameScreen[data-level="finish"] .completed-label{font-weight:1000;font-size:clamp(18px,4vw,34px);letter-spacing:.17em;color:#6dab75;text-shadow:0 2px #fff;animation:nextLevelPop .6s ease-out both;}
</style>

finishSound.preload='auto';
function playFinishSound(){if(!soundOn)return;try{finishSound.pause();finishSound.currentTime=0;finishSound.volume=.82;finishSound.play().catch(()=>{});}catch(e){}}
function tune(kind){if(kind==='level'){playLevelPassSound();return}if(kind==='finish'){playFinishSound();return}if(kind==='right'){playCorrectSound();return}if(kind==='wrong'){playWrongSound();return}if(!soundOn)return;try{audioContext??=new (window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')audioContext.resume();const c=audioContext;const now=c.currentTime+.015;const notes={right:[[523,0,.09],[659,.105,.10],[784,.22,.22]],wrong:[[340,0,.11],[290,.15,.18]],level:[[392,0,.12],[523,.14,.12],[659,.28,.12],[784,.43,.18],[1046,.63,.36]],combo:[[659,0,.10],[784,.11,.10],[988,.22,.12],[1175,.36,.25]],intro:[[523,0,.09],[660,.16,.13]],finish:[[523,0,.13],[659,.15,.13],[784,.30,.13],[988,.45,.15],[1046,.64,.16],[1318,.84,.45]]}[kind]||[];for(const [freq,offset,dur]of notes){const osc=c.createOscillator(),gain=c.createGain();osc.type=kind==='wrong'?'sine':'triangle';osc.frequency.setValueAtTime(freq,now+offset);gain.gain.setValueAtTime(.001,now+offset);gain.gain.exponentialRampToValueAtTime(kind==='wrong'?.08:.11,now+offset+.016);gain.gain.exponentialRampToValueAtTime(.001,now+offset+dur);osc.connect(gain).connect(c.destination);osc.start(now+offset);osc.stop(now+offset+dur+.03)}}catch(e){}}
function say(text,rate=.83){if(!soundOn||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>/^en-GB/i.test(v.lang)&&/female|Google|Samantha|Serena|Kate/i.test(v.name))||vs.find(v=>/^en-GB/i.test(v.lang))||vs.find(v=>/^en-/i.test(v.lang))||null;u.lang=u.voice?.lang||'en-GB';u.rate=rate;u.pitch=1.12;u.volume=1;speechSynthesis.speak(u)}catch(e){}}
function delayedSay(text,ms=450){setTimeout(()=>{if(soundOn)say(text)},ms)}
function el(tag,cl='',text){let e=document.createElement(tag);if(cl)e.className=cl;if(text!==undefined)e.textContent=text;return e}
function choiceBtn(text,fn){const b=el('button','choice-btn',text);b.onclick=fn;return b}
function addClickSound(){tune('intro')}
function showGame(){ $('#startScreen').classList.remove('active');$('#gameScreen').classList.add('active')}
function setHeader(title,caption,sub,percent){$('#title').textContent=title;$('#stepCaption').textContent=caption;$('#instruction').textContent=sub;$('#progressInner').style.width=percent+'%';$('#levelPill').textContent='LEVEL '+(currentLevel+1);$('#feedback').textContent='';$('#feedback').className='feedback';$('#questionArea').replaceChildren();$('#footer').textContent='' }
function paintFeedback(success,msg){const f=$('#feedback');f.className='feedback '+(success?'spark':'bad');f.textContent=msg}
function success(next,msg='⭐'){if(busy)return;busy=true;streak++;tune('right');paintFeedback(true,msg);stars();if(streak%3===0){toast('🌟 SUPER COMBO! 🌟');confetti(25)}setTimeout(()=>{busy=false;next()},1150)}
function fail(msg='Try again! 💕'){if(busy)return;streak=0;tune('wrong');paintFeedback(false,msg)}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1350)}
function stars(){const a=['⭐','✨','🌟'];for(let i=0;i<6;i++){const e=el('div','floaty',a[i%3]);e.style.left=(20+Math.random()*60)+'vw';e.style.top=(35+Math.random()*40)+'vh';e.style.animationDelay=(i*.05)+'s';document.body.append(e);setTimeout(()=>e.remove(),1250)}}
function confetti(count=70){const parent=$('#confetti');const colors=['#f35675','#9dde9d','#ffd66b','#a6d1f5','#efaed2'];for(let i=0;i<count;i++){const e=el('span','confetti');e.style.left=Math.random()*100+'%';e.style.background=colors[i%colors.length];e.style.setProperty('--dx',((Math.random()-.5)*240)+'px');e.style.setProperty('--duration',(1.5+Math.random()*2)+'s');e.style.animationDelay=Math.random()*.6+'s';parent.append(e);setTimeout(()=>e.remove(),4300)}}
function speakerButton(text){const b=el('button','speaker','🔊');b.setAttribute('aria-label','Listen again');b.title='Listen again';b.onclick=()=>say(text);return b}
function picture(object,n,color){const wrap=el('div','picture');wrap.setAttribute('aria-label',`${n} ${color||''} ${noun(object,n)}`.trim());for(let k=0;k<n;k++){let obj=el('span','object');obj.style.animationDelay=k*.05+'s';obj.append(makeObject(object,color,k));wrap.append(obj)}return wrap}
function svgNode(s){const w=document.createElement('span');w.innerHTML=s.trim();return w.firstChild}
const palette={red:'#f15d6d',pink:'#f49ac2',blue:'#69b1ee',green:'#6cc77a',yellow:'#ffd35f',purple:'#b99aee',orange:'#ffb45f'};
function makeObject(id,color,i){
 const iconMap={
   crayon:'🖍️',pencil:'✏️',book:'📕',banana:'🍌',apple:'🍎',strawberry:'🍓',car:'🚗',flower:'🌸',house:'🏠',cat:'🐱',chair:'🪑',table:'🪑',desk:'🪑',computer:'💻',doughnut:'🍩',cake:'🧁',robot:'🤖'
 };
 const colorIconMap={
   apple:{green:'🍏',red:'🍎'},
   book:{blue:'📘',green:'📗',red:'📕'},
   flower:{pink:'🌸',blue:'🪻',green:'🌼',yellow:'🌼',red:'🌺',purple:'🪻'}
 };
 if(id==='crayon' && color){
   const shades={red:'#e94b62',blue:'#4c99ef',green:'#57bc84',pink:'#f28bbd',yellow:'#f5c54f',purple:'#aa86e0',orange:'#f1a55c'};
   const fill=shades[color]||shades.red;
   return svgNode(`<svg viewBox="0 0 90 104" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="crayonShade${i}" x1="0" x2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".45"/><stop offset=".4" stop-color="${fill}"/><stop offset="1" stop-color="#303040" stop-opacity=".27"/></linearGradient></defs><g transform="rotate(-14 45 52)"><path d="M26 26L45 5 64 26Z" fill="${fill}" stroke="#6e6579" stroke-width="3" stroke-linejoin="round"/><rect x="26" y="24" width="38" height="67" rx="7" fill="${fill}" stroke="#6e6579" stroke-width="3"/><rect x="29" y="26" width="32" height="62" rx="5" fill="url(#crayonShade${i})"/><rect x="26" y="47" width="38" height="13" fill="#fff9ef" stroke="#6e6579" stroke-width="2"/><path d="M36 28V44" stroke="#fff" stroke-width="5" opacity=".55" stroke-linecap="round"/></g></svg>`);
 }
 const icon=(colorIconMap[id]&&colorIconMap[id][color])||iconMap[id]||lex[id]?.symbol||'✨';
 const s=el('span','emoji emoji-3d',icon);
 if(id==='car'&&color){const carFilters={red:'none',blue:'hue-rotate(205deg) saturate(1.25)',green:'hue-rotate(115deg) saturate(1.1)',pink:'hue-rotate(315deg) saturate(.8)'};s.style.filter=carFilters[color]||'none'}
 if(id==='house'&&color){const houseFilters={pink:'hue-rotate(315deg) saturate(.95)',blue:'hue-rotate(205deg) saturate(1.2)',green:'hue-rotate(110deg) saturate(1.0)',red:'none'};s.style.filter=houseFilters[color]||'none'}
 s.style.display='inline-grid';
 s.style.placeItems='center';
 s.style.minWidth='1.05em';
 s.style.minHeight='1.05em';
 return s
}
function goLevel(l){currentLevel=l;index=0;questionSequence=cards[l];showGame();numberChallenge()}
function numberChallenge(){document.getElementById('gameScreen').dataset.level='number';busy=false;const n=Math.floor(Math.random()*100)+1;numberAnswer=n;let opts=[n];while(opts.length<3){let candidate=Math.floor(Math.random()*100)+1;if(!opts.includes(candidate))opts.push(candidate)}opts=shuffle(opts);setHeader('NUMBER CHALLENGE!','','',0);const q=$('#questionArea');let box=el('div','number-card');box.append(el('div','number-icon','🎧'));const b=speakerButton(numWord(n));box.append(b);const optsDiv=el('div','number-choices');opts.forEach(x=>{let bt=el('button','number-choice',x);bt.onclick=()=>{if(busy)return;if(x===n){bt.classList.add('correct');success(()=>levelIntro(),'⭐')}else{bt.classList.add('wrong');fail();setTimeout(()=>bt.classList.remove('wrong'),650)}};optsDiv.append(bt)});box.append(optsDiv);q.append(box);tune('intro');delayedSay(numWord(n),580)}
function levelIntro(){document.getElementById('gameScreen').dataset.level='intro';const title=levelNames[currentLevel];setHeader('LEVEL '+(currentLevel+1),'✨ NEW LEVEL ✨',title,0);const q=$('#questionArea');const wrap=el('div','interlude');wrap.append(el('div','interlude-emoji',['✏️','🔢','🎨','🧩','🏆','✅'][currentLevel]));wrap.append(el('div','title',title));q.append(wrap);tune('level');confetti(35);delayedSay('Level '+numWord(currentLevel+1)+'. '+title,400);setTimeout(()=>renderQuestion(),2100)}
function renderQuestion(){busy=false;document.getElementById('gameScreen').dataset.level=String(currentLevel+1);let q=questionSequence[index];setHeader(levelNames[currentLevel],`QUESTION ${index+1} / ${questionSequence.length}`,levelSubtitles[currentLevel],index/questionSequence.length*100);if(currentLevel===0)renderL1(q);if(currentLevel===1)renderL2(q);if(currentLevel===2)renderL3(q);if(currentLevel===3)renderL4(q);if(currentLevel===4)renderL5(q);if(currentLevel===5)renderL6(q)}
function nextQuestion(){index++;if(index>=questionSequence.length)finishLevel();else renderQuestion()}
function finishLevel(){document.getElementById('gameScreen').dataset.level='finish';const last=currentLevel===5;tune(last?'finish':'level');confetti(115);setHeader('','', '',100);const q=$('#questionArea');const w=el('div','interlude');w.append(el('div','interlude-emoji',last?'🏆':'🎉'));if(last)w.append(el('div','completed-label','COMPLETED'));
w.append(el('div','next-level-message',last?'WELL DONE!':'NEXT LEVEL!'));if(last){let again=el('button','big-btn','↻ PLAY AGAIN');again.onclick=()=>{streak=0;goLevel(0)};w.append(again)}q.append(w);if(!last)setTimeout(()=>goLevel(currentLevel+1),2600)}
function renderL1(q){let a=$('#questionArea'),p=el('div','one-picture');p.append(picture(q.object,q.n));a.append(p);const row=el('div','choice-row');shuffle([lex[q.object].one,lex[q.object].many]).forEach(t=>{let b=choiceBtn(t,()=>{if(busy)return;say(t,.88);if(t===noun(q.object,q.n)){b.classList.add('correct');success(nextQuestion)}else{b.classList.add('wrong');streak=0;tune('wrong');paintFeedback(false,'Try again! 💕');setTimeout(()=>b.classList.remove('wrong'),650)}});row.append(b)});a.append(row);const sp=speakerButton(noun(q.object,q.n));sp.style.width='51px';sp.style.height='51px';sp.style.fontSize='23px';a.append(sp)}
function renderL2(q){const a=$('#questionArea'),head=el('div','question-line');head.append(el('div','phrase',numPhrase(q)));head.append(speakerButton(numPhrase(q)));a.append(head);const grid=el('div','picture-choice-grid');shuffle([q.n,q.wrongN]).forEach(n=>{let b=el('button','image-option');b.setAttribute('aria-label',`${n} ${noun(q.object,n)}`);b.append(picture(q.object,n));b.onclick=()=>{if(busy)return;if(n===q.n){b.classList.add('correct');success(nextQuestion)}else{b.classList.add('wrong');fail();setTimeout(()=>b.classList.remove('wrong'),650)}};grid.append(b)});a.append(grid);delayedSay(numPhrase(q),250)}
function renderL3(q){const a=$('#questionArea');const right=q.options.find(o=>o.right);const head=el('div','question-line'),phrase=colorPhrase({object:q.object,n:right.n,color:right.color});head.append(el('div','phrase',phrase));head.append(speakerButton(phrase));a.append(head);const grid=el('div','picture-choice-grid');q.options=shuffle(q.options);q.options.forEach(v=>{let b=el('button','image-option');b.setAttribute('aria-label',`${v.n} ${v.color} ${noun(q.object,v.n)}`);b.append(picture(q.object,v.n,v.color));b.onclick=()=>{if(busy)return;if(v.right){b.classList.add('correct');success(nextQuestion)}else{b.classList.add('wrong');fail();setTimeout(()=>b.classList.remove('wrong'),650)}};grid.append(b)});a.append(grid);delayedSay(phrase,250)}
function renderL4(q){matchState={chosen:null,placed:{},complete:false};const a=$('#questionArea'),g=el('div','match-grid'),single=fullSentence(q.object,1),plural=fullSentence(q.object,q.n),values=[{id:'one',n:1,text:single},{id:'many',n:q.n,text:plural}];values.forEach(v=>{let card=el('div','match-card');card.append(picture(q.object,v.n));let zone=el('div','dropzone','Drop here ↓');zone.tabIndex=0;zone.dataset.id=v.id;zone.onclick=()=>dropChip(v.id);zone.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();dropChip(v.id)}};zone.ondragover=e=>e.preventDefault();zone.ondrop=e=>{e.preventDefault();if(e.dataTransfer)placeMatch(e.dataTransfer.getData('text/plain'),v.id)};card.append(zone);g.append(card)});a.append(g);const bank=el('div','word-bank');shuffle(values).forEach(v=>{const chip=el('button','chip',v.text);chip.type='button';chip.dataset.id=v.id;chip.draggable=true;chip.onclick=()=>chooseChip(v.id);chip.ondragstart=e=>{matchState.chosen=v.id;e.dataTransfer.setData('text/plain',v.id);e.dataTransfer.effectAllowed='move'};addPointerDrag(chip,v.id);bank.append(chip)});a.append(bank);a.append(speakerButton(single+' '+plural))}
function chooseChip(id){if(busy||matchState.placed[id])return;matchState.chosen=id;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('chosen',c.dataset.id===id))}
function dropChip(target){if(matchState?.chosen)placeMatch(matchState.chosen,target)}
function placeMatch(chosen,target){if(!matchState||busy||matchState.placed[chosen]||matchState.placed[target])return;const zone=document.querySelector(`.dropzone[data-id="${target}"]`);if(!zone)return;if(chosen!==target){fail('Try the other picture! 💕');zone.classList.add('error');setTimeout(()=>zone.classList.remove('error'),550);return}matchState.placed[chosen]=true;zone.textContent=chosen==='one'?fullSentence(questionSequence[index].object,1):fullSentence(questionSequence[index].object,questionSequence[index].n);zone.classList.add('filled');document.querySelectorAll('.chip').forEach(c=>{if(c.dataset.id===chosen)c.classList.add('used')});matchState.chosen=null;document.querySelectorAll('.chip').forEach(c=>c.classList.remove('chosen'));tune('right');if(Object.keys(matchState.placed).length===2)success(nextQuestion,'⭐');else paintFeedback(true,'🌟')}
function addPointerDrag(chip,id){let sx=0,sy=0,ghost=null,dragged=false;chip.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;sx=e.clientX;sy=e.clientY;dragged=false});chip.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||!e.buttons)return;if(!dragged&&Math.hypot(e.clientX-sx,e.clientY-sy)>12){dragged=true;chip.setPointerCapture(e.pointerId);ghost=chip.cloneNode(true);ghost.className='chip drag-ghost';document.body.append(ghost)}if(dragged&&ghost){ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px'}});chip.addEventListener('pointerup',e=>{if(!dragged)return;const hit=document.elementFromPoint(e.clientX,e.clientY)?.closest('.dropzone');if(hit)placeMatch(id,hit.dataset.id);ghost?.remove();ghost=null;dragged=false});chip.addEventListener('pointercancel',()=>{ghost?.remove();ghost=null;dragged=false})}
function renderL5(q){fillState={stage:q.stage,q,answers:[],used:new Set()};const a=$('#questionArea');const pic=el('div','one-picture');pic.classList.add('stage-picture');pic.append(picture(q.object,q.n,q.color));a.append(pic);if(q.stage==='A')renderStageA(q,a);else renderStageWords(q,a);a.append(speakerButton(fullSentence(q.object,q.n,q.color)))}
function renderStageA(q,a){const sentence=el('div','sentence');sentence.append(document.createTextNode('There '));sentence.append(el('span','blank','_____'));sentence.append(document.createTextNode(` ${q.n===1?'one':q.n} ${noun(q.object,q.n)}.`));a.append(sentence);const row=el('div','choice-row');const wanted=q.n===1?'is':'are';shuffle(['is','are']).forEach(x=>{let b=choiceBtn(x,()=>{if(busy)return;say(x,.86);if(x===wanted){b.classList.add('correct');sentence.querySelector('.blank').textContent=x;success(nextQuestion)}else{b.classList.add('wrong');fail();setTimeout(()=>b.classList.remove('wrong'),650)}});row.append(b)});a.append(row)}
function renderStageWords(q,a){let words=q.n===1?['There','is','one']:['There','are',numWord(q.n)];if(q.stage==='D')words=[q.n===1?'There':'There',q.n===1?'is':'are',q.n===1?'one':numWord(q.n),q.color];const expected=q.stage==='B'?words.slice(0,2):(q.stage==='C'?words.slice(0,3):words.slice(0,4));const line=el('div','sentence');expected.forEach((_,i)=>{const slot=el('button','blank hint','_____');slot.dataset.slot=i;slot.title='Tap to remove a word';slot.onclick=()=>undoSlot(i);line.append(slot)});const tail=(q.stage==='B'?(q.n===1?'one':q.n)+' ':'') + (q.stage==='D'?' ':'') + `${noun(q.object,q.n)}.`;line.append(document.createTextNode(tail));a.append(line);const bank=el('div','word-bank');let extras=[];if(q.stage==='B')extras=[q.n===1?'are':'is'];else if(q.stage==='C')extras=['are'===words[1]?'is':'are'];else if(q.stage==='D')extras=[q.color==='red'?'blue':'red',q.n===1?'are':'is'];shuffle([...expected,...extras]).forEach((word,i)=>{const chip=el('button','chip',word);chip.type='button';chip.dataset.word=word;chip.dataset.uid=i;chip.onclick=()=>addWord(chip);bank.append(chip)});a.append(bank);fillState.expected=expected}
function addWord(chip){if(busy||chip.classList.contains('used'))return;const f=fillState;const n=f.answers.length;if(n>=f.expected.length)return;const word=chip.dataset.word;say(word,.86);if(word!==f.expected[n]){chip.style.background='#ffe2eb';setTimeout(()=>chip.style.background='',500);fail();return}f.answers.push({word,chip});chip.classList.add('used');const blank=document.querySelector(`.blank[data-slot="${n}"]`);blank.textContent=word;blank.classList.add('filled');tune('right');if(f.answers.length===f.expected.length){success(nextQuestion,'⭐')}}
function undoSlot(i){if(busy||!fillState||i>=fillState.answers.length)return;const removed=fillState.answers.splice(i);removed.forEach(x=>x.chip.classList.remove('used'));document.querySelectorAll('.blank[data-slot]').forEach((slot,n)=>{slot.textContent=fillState.answers[n]?.word||'_____';slot.classList.toggle('filled',!!fillState.answers[n])})}

function renderL6(q){
 const a=$('#questionArea');
 const sentence=fullSentence(q.object,q.n,q.color);
 const words=['There',q.n===1?'is':'are',q.n===1?'one':numWord(q.n),q.color,noun(q.object,q.n)];
 const chosen=[];
 const pic=el('div','one-picture');pic.classList.add('stage-picture');pic.append(picture(q.object,q.n,q.color));a.append(pic);
 const answer=el('div','sentence level6-answer');answer.setAttribute('aria-label','Build the sentence');a.append(answer);
 const bank=el('div','word-bank level6-bank');a.append(bank);
 
 // Stable shuffle prevents any answer-key text appearing before a completed answer.
 const tiles=shuffle(words.map((word,id)=>({word,id})));
 function paint(){
   answer.replaceChildren();
   words.forEach((_,pos)=>{
     const wordBtn=el('button','blank level6-slot'+(chosen[pos]?' filled':''),chosen[pos]?.word||'____');
     wordBtn.type='button';wordBtn.title='Tap to undo';
     wordBtn.onclick=()=>{if(busy||pos>=chosen.length)return;chosen.splice(pos);paint()};
     answer.append(wordBtn);
   });
   answer.append(document.createTextNode('.'));
   bank.replaceChildren();
   tiles.forEach(tile=>{
      const bt=el('button','chip level6-word',tile.word);bt.type='button';
      bt.disabled=chosen.some(c=>c.id===tile.id);
      bt.onclick=()=>{
        if(busy||chosen.some(c=>c.id===tile.id))return;
        say(tile.word,.86);
        if(tile.word!==words[chosen.length]){
          bt.classList.add('wrong-tile');fail();setTimeout(()=>bt.classList.remove('wrong-tile'),650);return;
        }
        chosen.push(tile);tune('right');paint();
        if(chosen.length===words.length){
          busy=true;streak++;paintFeedback(true,'⭐');stars();
          if(streak%3===0){toast('🌟 SUPER COMBO! 🌟');confetti(30)}
          setTimeout(()=>say(sentence,.78),950);
          setTimeout(()=>{busy=false;if(currentLevel===5 && index===questionSequence.length-1){finishLevel()}else{nextQuestion()}},3600);
        }
      };
      bank.append(bt);
   });
 }
 paint();
}
$('#startBtn').onclick=()=>{showGame();tune('intro');goLevel(0)};
$('#soundToggle').onclick=()=>{soundOn=!soundOn;$('#soundToggle').textContent=soundOn?'🔊':'🔇';if(!soundOn&&'speechSynthesis'in window)speechSynthesis.cancel();else tune('right')};
// Load voice packs before the first speech request on browsers that populate them asynchronously.
if('speechSynthesis'in window){speechSynthesis.getVoices();speechSynthesis.addEventListener?.('voiceschanged',()=>speechSynthesis.getVoices())}
</script>
</body></html>
